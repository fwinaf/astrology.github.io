<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Location</title>

  <!-- EmailJS browser SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Share your location</h1>

  <p>
    Click below to share your current browser location with the site owner.
  </p>

  <button id="locationButton">Share my location</button>
  <p id="status"></p>

  <script>
    // Replace this with your EmailJS public key
    emailjs.init({
      publicKey: "YOUR_EMAILJS_PUBLIC_KEY"
    });

    const button = document.getElementById("locationButton");
    const status = document.getElementById("status");

    button.addEventListener("click", () => {
      if (!navigator.geolocation) {
        status.textContent = "Geolocation is not supported by this browser.";
        return;
      }

      status.textContent = "Waiting for permission...";
      button.disabled = true;

      navigator.geolocation.getCurrentPosition(
        async position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;
          const time = new Date().toISOString();

          const mapLink =
            `https://www.google.com/maps?q=${latitude},${longitude}`;

          try {
            await emailjs.send(
              "dineshandsons2070@gmail.com",
              "service_a3e3yq5",
              {
                to_email: "maanlakshay00@gmail.com",
                latitude: latitude,
                longitude: longitude,
                accuracy: Math.round(accuracy),
                time: time,
                map_link: mapLink
              }
            );

            status.textContent = "Your location was sent successfully.";
          } catch (error) {
            console.error(error);
            status.textContent = "The location could not be sent.";
            button.disabled = false;
          }
        },

        error => {
          button.disabled = false;

          if (error.code === 1) {
            status.textContent = "Location permission was denied.";
          } else {
            status.textContent = "Unable to get your location.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
