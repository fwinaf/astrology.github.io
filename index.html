<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Location</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>Share your location</h1>

  <p>
    Click the button below to share your current location with the site owner.
  </p>

  <button id="locationButton">Share my location</button>
  <p id="status"></p>

  <script>
    const EMAILJS_PUBLIC_KEY = "vdXmhe_duYHT5y0qd";
    const EMAILJS_SERVICE_ID = "service_a3e3yq5";
    const EMAILJS_TEMPLATE_ID = "template_01cyemm";

    emailjs.init({
      publicKey: EMAILJS_PUBLIC_KEY
    });

    const button = document.getElementById("locationButton");
    const status = document.getElementById("status");

    button.addEventListener("click", () => {
      if (!navigator.geolocation) {
        status.textContent =
          "Geolocation is not supported by this browser.";
        return;
      }

      status.textContent = "Waiting for location permission...";
      button.disabled = true;

      navigator.geolocation.getCurrentPosition(
        async position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);
          const time = new Date().toISOString();

          const mapLink =
            `https://www.google.com/maps?q=${latitude},${longitude}`;

          const templateParameters = {
            to_email: "dineshandsons2070@gmail.com",
            latitude: latitude,
            longitude: longitude,
            accuracy: accuracy,
            time: time,
            map_link: mapLink
          };

          try {
            await emailjs.send(
              "service_a3e3yq5",
              "template_01cyemm",
              templateParameters
            );

            status.textContent = "Your location was sent successfully.";
          } catch (error) {
            console.error("EmailJS error:", error);

            status.textContent =
              "The location was found, but the email could not be sent. " +
              "Check the browser console for details.";

            button.disabled = false;
          }
        },

        error => {
          button.disabled = false;

          if (error.code === 1) {
            status.textContent =
              "Location permission was denied.";
          } else if (error.code === 2) {
            status.textContent =
              "Your location could not be determined.";
          } else if (error.code === 3) {
            status.textContent =
              "The location request timed out.";
          } else {
            status.textContent =
              "An unknown location error occurred.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  </script>
</body>
</html>
